{% extends 'base.html' %}

{% block title %}Мое резюме | Кадровое агентство{% endblock %}

{% block content %}
<section class="section page-card">
    <div class="section-head">
        <h1>Мое резюме</h1>
        <a class="btn btn-secondary" href="{{ url_for('edit_resume') }}">Редактировать</a>
    </div>

    <div class="detail-block">
        <h2>{{ resume.title }}</h2>
    </div>

    <div class="detail-block">
        <h3>О себе</h3>
        <p class="pre-line">{{ resume.about }}</p>
    </div>

    <div class="detail-block">
        <h3>Навыки</h3>
        <p class="pre-line">{{ resume.skills }}</p>
    </div>

    <div class="detail-block">
        <h3>Опыт работы</h3>
        <p class="pre-line">{{ resume.experience }}</p>
    </div>

    <div class="detail-block">
        <h3>Контакты</h3>
        <p class="pre-line">{{ resume.contacts }}</p>
    </div>
</section>
{% endblock %}
